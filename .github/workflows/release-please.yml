name: release-please

on:
  push:
    branches:
      - main

permissions: {}

# Релиз нельзя прерывать: новый прогон ждёт завершения текущего
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # коммиты release-PR и тег vX.Y.Z
      pull-requests: write # ведение release-PR
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
