name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2

      - run: mise run api-check
      - run: mise run lint
      - run: mise run test-junit
      - run: mise run frontend-test-junit
      # e2e: системные зависимости chromium (--with-deps) — только для ubuntu;
      # сама задача e2e-junit идемпотентно доустановит браузеры (no-op)
      - run: mise x -- playwright install --with-deps chromium
      - run: mise run e2e-junit

      # образ не пушится: шаг ловит поломку Dockerfile/сборки в контейнере
      - run: mise run docker-build

      - uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: reports/*.xml
